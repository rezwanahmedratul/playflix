services:
  - type: web
    name: playflix
    runtime: node
    plan: free
    buildCommand: "bun install && NITRO_PRESET=node-server bun run build"
    startCommand: "node .output/server/index.mjs"
    envVars:
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_VERSION
        value: 20
